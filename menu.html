<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Lifetime Of Us</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ==========================
   FADE IN OVERLAY
========================== */

#background{

    position:fixed;

    inset:0;

    background:url("images/menu-bg.jpg")
    center center/cover no-repeat;

    z-index:-2;

    animation:bgZoom 20s ease-in-out infinite alternate;
}

body{

    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
}

/* ==========================
   FADE IN OVERLAY
========================== */

#fadeIn{

    position:fixed;

    inset:0;

    background:black;

    opacity:1;

    z-index:9999;

    transition:opacity 3s ease;
}

/* ==========================
   BACKGROUND OVERLAY
========================== */

.overlay{

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.60);
}

/* ==========================
   MENU
========================== */

.menu{

    position:relative;

    z-index:10;

    text-align:center;

}

/* ==========================
   TITLE
========================== */

.gameTitle{

    font-family:'Allura', cursive;

    color:#F4D0C6;

    font-size:70px;

    text-shadow:
        0 0 8px rgba(244,208,198,.5),
        0 0 20px rgba(244,208,198,.2);

    margin-bottom:10px;

    opacity:0;

    transform:translateY(30px);

    animation:titleReveal 1.8s ease forwards;

}

/* ==========================
   TAGLINE
========================== */

.tagline{

    color:white;

    font-size:12px;

    letter-spacing:4px;

    margin-bottom:30px;

    opacity:0;

    transform:translateY(20px);

    animation:fadeUp 1s ease forwards;

    animation-delay:1s;
}
/* ==========================
   BUTTONS
========================== */

.menuButton{

    width:200px;

    padding:10px;

    margin:8px auto;

    border:1px solid rgba(255,255,255,.4);

    border-radius:50px;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    cursor:pointer;

   transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.menuButton:hover{

    background:rgba(244,208,198,.25);

    border-color:#F4D0C6;

    color:#fff;

    text-shadow:
        0 0 6px rgba(255,255,255,.6);

    transform:
        scale(1.08,1.05);
}

.menuButton.active{

    background:rgba(244,208,198,.20);

    border-color:#F4D0C6;

    color:#fff;

    transform:scale(1.03);

    box-shadow:
        0 0 20px rgba(244,208,198,.35);

    text-shadow:
        0 0 8px rgba(255,255,255,.6);
}

/* ==========================
   FOOTER
========================== */

.footer{

    margin-top:15px;

    color:#F4D0C6;

    font-size:18px;
}

.version{

    margin-top:2px;

    color:rgba(255,255,255,.6);

    font-size:12px;
}

/* ==========================
   MOBILE
========================== */

@media (max-width:768px){

    .gameTitle{
        font-size:64px;
    }

    .menuButton{
        width:150px;
    }

}

@keyframes titleReveal{

    from{

        opacity:0;

        transform:translateY(30px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes bgZoom{

    from{

        transform:scale(1);
    }

    to{

        transform:scale(1.08);
    }
}

</style>

</head>

<body>

<div id="background"></div>

<!-- Fade-in screen -->
<div id="fadeIn"></div>

<!-- Dark overlay -->
<div class="overlay"></div>

<!-- Menu -->
<div class="menu">

    <div class="gameTitle">
        A Lifetime Of Us
    </div>

    <div class="tagline">
        EVERY MEMORY BEGINS WITH YOU
    </div>

    <button
        class="menuButton"
        onclick="location.href='prologue.html'">
        New Game
    </button>

    <button
        class="menuButton"
        onclick="alert('Continue feature coming soon')">
        Continue
    </button>

    <button
        class="menuButton"
        onclick="location.href='save.html'">
        Save
    </button>

    <button
        class="menuButton"
        onclick="location.href='load.html'">
        Load
    </button>

    <button
        class="menuButton"
        onclick="location.href='gallery.html'">
        Memories
    </button>

    <button
        class="menuButton"
        onclick="location.href='credits.html'">
        Credits
    </button>

    <div class="footer">
        ─ ♡ ─
    </div>

    <div class="version">
        Version 1.0
    </div>

</div>

<script>

window.addEventListener("load", function(){

    const overlay =
        document.getElementById("fadeIn");

    setTimeout(function(){

        overlay.style.opacity = "0";

    }, 100);

    setTimeout(function(){

        overlay.remove();

    }, 3100);

    const buttons =
        document.querySelectorAll(".menuButton");

    document.addEventListener("touchmove", function(e){

        buttons.forEach(btn =>
            btn.classList.remove("active")
        );

        const touch =
            document.elementFromPoint(
                e.touches[0].clientX,
                e.touches[0].clientY
            );

        if(
            touch &&
            touch.classList.contains("menuButton")
        ){
            touch.classList.add("active");
        }

    }, { passive:true });

    document.addEventListener("touchend", function(){

        buttons.forEach(btn =>
            btn.classList.remove("active")
        );

    });

});

</script>

</body>
</html>
