<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Lifetime Of Us</title>

<style>

/* ==========================
   PAGE
========================== */

body{
    margin:0;
    *olor:white;
    font-family:Arial,*sans-serif;
    overflow:hidden;

*   background-image:url("images/lo*ding-portrait.png");
    backgroun*-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Portrait */

@media (orientation: *ortrait){

    body{
        background-image:url("images/loading-portrait.png");
    }

}

/* Landscape */

@media (orientation: landscape)*

    body{
        background-image:url("images/loading-landscape2.png");
    }

}

/* ==========================
   SCREENS
========================== */

.screen{
    width:100vw;
    h*ight:100vh;
}

.hidden{
    display:none;
}

/* ==========================
   LOADING
========================== */

#loading{
    position:relative;
}

/* REAL BAR */

#realLoader{

    position:absolute;

    width:250px;
    height:14px;

    border-radius:30px;

    overflow:hidden;

    left:50%;
    top:48.5%;

    transform:translate(-50%,-50%);
}

/* LANDSCAPE POSITION */

@media (orientation: landscape){

    #realLoader{
        width:320px;
        top:53%;
    }

}

#realFill{

    width:0%;
    height:100%;

    border-radius:30px;

    background:#f7c4d9;

    box-shadow:
        0 0 10px #f7c4d9,
        0 0 20px #f7c4d9,
        0 0 35px #f7c4d9;

}

#realPercentage{

    position:absolute;

    color:white;

    font-size:20px;

    left:50%;
    top:48.5%;

    transform:translate(155px,-50%);
}

/* LANDSCAPE POSITION */

@media (orientation: landscape){

    #realPercentage{

        font-size:28px;

        top:53%;

        transform:translate(190px,-50%);
    }

}

/* ==========================
   GAME
========================== */

#game{

    display:flex;

    justify-content:center;

    align-items:center;
}

#dialogueBox{

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(10px);

    width:90%;
    max-width:700px;

    padding:25px;

    border-radius:15px;
}

#place{

    margin-top:0;
}

button{

    padding:12px 24px;

    border:none;

    border-radius:10px;

    background:pink;

    cursor:pointer;

    font-size:16px;

    margin-top:15px;
}

button:hover{

    opacity:.9;
}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loading" class="screen">

    <div id="realLoader">
        <div id="realFill"></div>
    </div>

    <div id="realPercentage">
        0%
    </div>

</div>

<!-- GAME -->

<div id="game" class="screen hidden">

    <div id="dialogueBox">

        <h2 id="place"></h2>

        <h3>Memory Keeper</h3>

        <p id="dialogue"></p>

        <button onclick="nextScene()">
            Continue
        </button>

    </div>

</div>

<script>

/* ==========================
   STORY
========================== */

const scenes = [

{
place:"Welcome",
text:"Welcome. I've been asked to show you some special memories tonight."
},

{
place:"IT Park",
text:"Do you remember our walks here? What felt ordinary then became one of my favorite memories."
},

{
place:"Ayala",
text:"Some of my favorite memories started with simple moments like these."
},

{
place:"Happy Monthsary",
text:"Thank you for staying, loving me, and sharing these memories."
},

{
place:"To Be Continued",
text:"This is only the beginning of our story."
}

];

let currentScene = 0;

/* ==========================
   DISPLAY SCENE
========================== */

function showScene(){

    document.getElementById("place").innerText =
    scenes[currentScene].place;

    document.getElementById("dialogue").innerText =
    scenes[currentScene].text;
}

/* ==========================
   NEXT SCENE
========================== */

function nextScene(){

    currentScene++;

    if(currentScene < scenes.length){

        showScene();
    }
}

/* ==========================
   START GAME
========================== */

function startGame(){

    document.getElementById("loading").style.opacity = "0";

    setTimeout(function(){

        document.getElementById("loading").style.display = "none";

        document.getElementById("game").classList.remove("hidden");

        showScene();

    },1000);
}

   LOADER
========================== */

    document.getElementById("realFill").style.width =
    progress + "%";

    document.getElementById("realPercentage").innerText =
    progress + "%";

    if(progress >= 100){

        clearInterval(loader);

        setTimeout(function(){
