<!DOCTYPE html>
<html>
<head>

<title>A Lifetime Of Us</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    background:#000;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:Arial, sans-serif;
}

/* ==========================
   PORTRAIT
========================== */

@media (orientation: portrait){

    body{
        background-image:url("images/loading-portrait.png");
        background-position:center center;
    }

    .title{
        display:none;
    }

    #loadingUI{

        position:absolute;

        left:50%;
        bottom:3%;

        transform:translateX(-50%);

        width:180px;

        text-align:center;

        display:flex;
        flex-direction:column;
        align-items:center;
    }

    #loader{
        width:140px;
    }

    #percentage{
        font-size:9px;
    }

    .caption{
        font-size:8px;
        letter-spacing:1px;
        margin-top:2px;
        margin-bottom:2px;
    }

    .footer{
        font-size:12px;
        margin-top:0;
    }
}

/* ==========================
   LANDSCAPE
========================== */

@media (orientation: landscape){

    body{
        background-image:url("images/loading-landscape.png");
        background-position:center center;
    }

    #loadingUI{

        position:absolute;

        left:68%;
        top:54%;

        transform:translate(-50%, -50%);

        width:75vw;
        max-width:320px;

        text-align:center;

        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .title{
        font-size:clamp(22px, 3vw, 30px);
    }

    #loader{
        width:240px;
    }

    #percentage{
        font-size:11px;
    }
}

/* ==========================
   LOADING UI
========================== */

#loadingUI{

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ==========================
   TITLE
========================== */

.title{

    color:#F4D0C6;

    font-family:'Allura', cursive;

    font-size:30px;

    white-space:nowrap;

    line-height:1;

    margin-bottom:8px;

    text-shadow:
        0 0 3px rgba(244,208,198,.4),
        0 0 6px rgba(244,208,198,.2);
}

/* ==========================
   BAR ROW
========================== */

.barRow{

    width:100%;

    display:flex;

    justify-content:center;

    margin-bottom:6px;
}

/* ==========================
   LOADER
========================== */

#loader{

    position:relative;

    height:16px;

    border:2px solid rgba(255,255,255,.9);

    border-radius:50px;

    overflow:hidden;

    background:rgba(255,255,255,.05);
}

/* ==========================
   FILL
========================== */

#fill{

    width:0%;

    height:100%;

    border-radius:50px;

    background:#F4D0C6;

    box-shadow:
        0 0 4px #F4D0C6,
        0 0 8px #F4D0C6;
}

/* ==========================
   PERCENTAGE
========================== */

#percentage{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    color:white;

    font-weight:bold;

    text-shadow:
        0 1px 2px rgba(0,0,0,.9);

    z-index:2;

    pointer-events:none;
}

/* ==========================
   CAPTION
========================== */

.caption{

    color:white;

    font-size:11px;

    letter-spacing:3px;

    margin-top:4px;

    margin-bottom:6px;
}

/* ==========================
   FOOTER
========================== */

.footer{

    color:#F4D0C6;

    font-size:18px;

    margin-top:2px;
}

/* ==========================
   FADE OVERLAY
========================== */

#fadeOverlay{

    position:fixed;

    inset:0;

    background:black;

    opacity:0;

    pointer-events:none;

    transition:opacity 3s ease;

    z-index:9999;
}

</style>

</head>

<body>

<div id="loadingUI">

    <div class="title">
        Preparing our next chapter
    </div>

    <div class="barRow">

        <div id="loader">

            <div id="fill"></div>

            <div id="percentage">
                0%
            </div>

        </div>

    </div>

    <div class="caption" id="captionText">
        JUST A LITTLE LONGER, MY LOVE
    </div>

    <div class="footer">
        ─ ♡ ─
    </div>

</div>

<div id="fadeOverlay"></div>

<script>

const portrait =
    window.matchMedia("(orientation: portrait)").matches;

const bgImage = portrait
    ? "images/loading-portrait.png"
    : "images/loading-landscape.png";

const preloadImage = new Image();

preloadImage.onload = () => {

    let progress = 0;

    const loader = setInterval(() => {

        progress++;

        document.getElementById("fill").style.width =
            progress + "%";

        document.getElementById("percentage").textContent =
            progress + "%";

        if(progress >= 100){

            clearInterval(loader);

            document.getElementById(
                "fadeOverlay"
            ).style.opacity = "1";

            setTimeout(() => {

                window.location.href =
                    "menu.html";

            },3000);
        }

    },40);

};

preloadImage.src = bgImage;

function updateCaption(){

    const portrait =
        window.matchMedia(
            "(orientation: portrait)"
        ).matches;

    document.getElementById(
        "captionText"
    ).textContent =
        portrait
        ? "I LOVE YOU, 3000."
        : "JUST A LITTLE LONGER, MY LOVE";
}

updateCaption();

window.addEventListener(
    "resize",
    updateCaption
);

</script>

</body>
</html>
