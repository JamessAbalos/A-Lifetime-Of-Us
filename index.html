<!DOCTYPE html>
<html>
<head>
<title>A Lifetime Of Us</title>

<style>

body{
    margin:0;
    height:100vh;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Portrait */
@media (orientation: portrait){

    body{
        background-image:url("images/loading-portrait.png");
    }

    #loader{
        width:250px;
        left:50%;
        top:40%;
    }

}

/* Landscape */
@media (orientation: landscape){

    body{
        background-image:url("images/loading-landscape2.png");
    }

    #loader{
        width:320px;
        left:63%;
        top:42%;
    }

}

/* Loading Bar Container */

#loader{

    position:absolute;

    height:14px;

    transform:translate(-50%,-50%);

    border-radius:20px;

    overflow:hidden;
}

/* Animated Fill */

#fill{

    width:0%;

    height:100%;

    border-radius:20px;

    background:#FDAB9F;

    box-shadow:
        0 0 4px #F4D0C6,
        0 0 8px #F4D0C6,
        0 0 12px rgba(244,208,198,0.5);
}

</style>
</head>

<body>

<div id="loader">
    <div id="fill"></div>
</div>

<script>

let progress = 0;

const loading = setInterval(function(){

    progress++;

    document.getElementById("fill").style.width =
    progress + "%";

    if(progress >= 100){

        clearInterval(loading);

    }

},40);

</script>

</body>
</html>
