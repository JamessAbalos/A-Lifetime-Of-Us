<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Lifetime Of Us</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

#background{
    position:fixed;
    inset:0;
    background:url("images/menu-bg.jpg")
    center center/cover no-repeat;
    z-index:-2;
    animation:bgZoom 20s ease-in-out infinite alternate;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

#fadeIn{
    position:fixed;
    inset:0;
    background:black;
    opacity:1;
    z-index:9999;
    transition:opacity 3s ease;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.60);
}

.menu{
    position:relative;
    z-index:10;
    text-align:center;
}

.gameTitle{
    font-family:'Allura', cursive;
    color:#F4D0C6;
    font-size:70px;
    text-shadow:
        0 0 8px rgba(244,208,198,.5),
        0 0 20px rgba(244,208,198,.2);
    margin-bottom:10px;
    opacity:0;
    transform:translateY(30px);
    animation:titleReveal 1.8s ease forwards;
}

.tagline{
    color:white;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:30px;
    opacity:0;
    transform:translateY(20px);
    animation:fadeUp 1s ease forwards;
    animation-delay:1s;
}

.menuButton{
    width:200px;
    padding:10px;
    margin:8px auto;
    border:1px solid rgba(255,255,255,.4);
    border-radius:50px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:16px;
    cursor:pointer;

    transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.menuButton:hover{
    background:rgba(244,208,198,.25);
    border-color:#F4D0C6;
    color:#fff;
    text-shadow:
        0 0 6px rgba(255,255,255,.6);
    transform:scale(1.08,1.05);
}

.menuButton:active{
    transform:scale(0.97);
}

.menuButton.active{
    background:rgba(244,208,198,.20);
    border-color:#F4D0C6;
    color:#fff;
    transform:scale(1.03);
    box-shadow:
        0 0 20px rgba(244,208,198,.35);
    text-shadow:
        0 0 8px rgba(255,255,255,.6);
}

.footer{
    margin-top:15px;
    color:#F4D0C6;
    font-size:18px;
}

.version{
    margin-top:2px;
    color:rgba(255,255,255,.6);
    font-size:12px;
}

@media (max-width:768px){

    .gameTitle{
        font-size:64px;
    }

    .menuButton{
        width:150px;
    }

}

@keyframes titleReveal{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bgZoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

</style>

</head>

<body>

<div id="background"></div>

<div id="fadeIn"></div>

<div class="overlay"></div>

<div class="menu">

    <div class="gameTitle">
        A Lifetime Of Us
    </div>

    <div class="tagline">
        EVERY MEMORY BEGINS WITH YOU
    </div>

    <button
        class="menuButton"
        onclick="playClickAndGo('prologue.html')">
        New Game
    </button>

    <button
        class="menuButton"
        onclick="playClickAlert()">
        Continue
    </button>

    <button
        class="menuButton"
        onclick="playClickAndGo('save.html')">
        Save
    </button>

    <button
        class="menuButton"
        onclick="playClickAndGo('load.html')">
        Load
    </button>

    <button
        class="menuButton"
        onclick="playClickAndGo('gallery.html')">
        Memories
    </button>

    <button
        class="menuButton"
        onclick="playClickAndGo('credits.html')">
        Credits
    </button>

    <div class="footer">
        ─ ♡ ─
    </div>

    <div class="version">
        Version 1.0
    </div>

</div>

<audio id="menuMusic" loop>
    <source src="audio/menu-bgm.mp3"
</audio>

<audio id="clickSound">
    <source src="audio/menu-click.mp3"
</audio>

<script>

const music = document.getElementById("menuMusic");
const clickSound = document.getElementById("clickSound");

function startMusic(){

    music.volume = 0;
    music.play().catch(err => console.log(err));

    let fadeIn = setInterval(() => {

        if(music.volume < 0.4){

            music.volume += 0.02;

        }else{

            music.volume = 0.4;
            clearInterval(fadeIn);

        }

    },100);

    document.removeEventListener(
        "pointerdown",
        startMusic
    );
}

document.addEventListener(
    "pointerdown",
    startMusic
);

function playClickAndGo(page){

    clickSound.currentTime = 0;
    clickSound.volume = 0.6;
    clickSound.play();

    setTimeout(() => {

        location.href = page;

    },150);
}

function playClickAlert(){

    clickSound.currentTime = 0;
    clickSound.volume = 0.6;
    clickSound.play();

    setTimeout(() => {

        alert("Continue feature coming soon");

    },150);
}

window.addEventListener("load", function(){

    const overlay =
        document.getElementById("fadeIn");

    setTimeout(function(){

        overlay.style.opacity = "0";

    }, 100);

    setTimeout(function(){

        overlay.remove();

    }, 3100);

    const buttons =
        document.querySelectorAll(".menuButton");

    document.addEventListener("touchmove", function(e){

        buttons.forEach(btn =>
            btn.classList.remove("active")
        );

        const touch =
            document.elementFromPoint(
                e.touches[0].clientX,
                e.touches[0].clientY
            );

        if(
            touch &&
            touch.classList.contains("menuButton")
        ){
            touch.classList.add("active");
        }

    }, { passive:true });

    document.addEventListener("touchend", function(){

        buttons.forEach(btn =>
            btn.classList.remove("active")
        );

    });

});

</script>

</body>
</html>
